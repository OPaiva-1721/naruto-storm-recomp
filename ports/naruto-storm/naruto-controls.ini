; Naruto PC controls. Restart the game after editing.
; Up to two key names per action, separated by a comma. NONE disables a binding.
; F1 captures/releases the mouse. Esc pauses and releases it; F1 resumes camera.
; A controller remains usable. The on-screen prompts still use PS3 symbols.
[move]
forward=W
backward=S
left=A
right=D

[buttons]
up=UP
down=DOWN
left=LEFT
right=RIGHT
cross=SPACE
circle=MOUSE1
square=MOUSE2
triangle=E
l1=Q
r1=R
l2=SHIFT
r2=CTRL
start=ESC,ENTER
select=TAB
l3=NONE
r3=NONE

[mouse]
enabled=1
sensitivity=0.8
invert_y=0
capture_key=F1
