# Public example. Override personal paths in ignored port.local.ini.
# PC: clang-cl + MSVC tools, Windows/D3D12. No automatic input.
[port]
TITLE = Naruto Ultimate Ninja Storm (BLES00371)
SYMBOL_PREFIX = naruto
EBOOT_BIN = rom/naruto-storm/game/PS3_GAME/USRDIR/EBOOT.BIN
EBOOT_ELF = rom/naruto-storm/game/PS3_GAME/USRDIR/EBOOT.elf
PS3RECOMP_DIR = external/ps3recomp
LIFT_DIR = build/naruto-storm-lift
RECOMP_DIR = build/naruto-storm-lift/recompiled
SPU_DIR = build/naruto-storm-lift/spu
JOBS_DIR = build/naruto-storm-lift/spujobs
BUILD_DIR = build/naruto-storm-win
EXE = build/naruto-storm-win/NarutoStorm.exe
HDD0_DIR = build/naruto-storm-hdd0
LIFT_ARGS = --fast-mem --jobs 2 --chunks 48
RUN_SECONDS = 130
CAP_FRAMES = 300:1:1
RUNTIME_DLL_DIR = external/ffmpeg/bin
RUNTIME_DLLS = avcodec-62.dll avutil-60.dll swresample-6.dll

[cmake]
CMAKE_LINKER = link.exe
CMAKE_C_FLAGS = /I{ROOT}/ports/naruto-storm/shim
CMAKE_EXE_LINKER_FLAGS = dxguid.lib
PS3RECOMP_FFMPEG_RUNTIME = ON
PS3RECOMP_FFMPEG_INCLUDE_DIR = {ROOT}/external/ffmpeg/include

[env]
PS3_VERBOSE = 0
PERF = 0
PS3_VFS_ROOT = rom/naruto-storm/game
PS3_DEV_FLASH = rom/dev_flash
SPU_INTERP_UNLIFTED = 1
PAD_PROFILE = naruto-pc
PAD_CONFIG = ports/naruto-storm/naruto-controls.ini
PS3_SAIL_AUTOSTART = 1
GCM_SEMA_ACQUIRE = 1
